<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bhavyata Portal — Textbooks</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="preview-banner"></div>

<div class="topbar">
  <div class="topbar-left">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <span class="topbar-brand"><span class="topbar-brand-icon"><img src="assets/logo.png" alt="Bhavyata Foundation logo" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="brand-fallback-emoji">🌱</span></span><span class="brand">Bhavyata portal</span></span>
    <span class="page-label">Textbooks</span>
  </div>
  <div class="user-menu" id="userMenu">
    <button class="user-menu-trigger" onclick="toggleUserMenu()">
      <span class="user-avatar">MS</span>
      <span class="user-name-block">
        <span class="user-name">Mrs. Sharma</span>
        <span class="tag">Teacher</span>
      </span>
      <span class="user-caret">▾</span>
    </button>
    <div class="user-dropdown hidden" id="userDropdown">
      <button onclick="logout()">Log out</button>
    </div>
  </div>
</div>

<div class="layout">
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-nav">
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=workbook'">📘 <span>Weekly Activities</span></button>
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=attendance'">🗓️ <span>Attendance</span></button>
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=calendar'">📅 <span>My Attendance</span></button>
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=events'">📌 <span>School Events</span></button>
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=uploadphoto'">📷 <span>Upload Activity Photo</span></button>
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=materials'">📦 <span>Materials</span></button>
    <button class="sidebar-nav-btn" onclick="location.href='index.html?section=volunteers'">🤝 <span>Parent Volunteers</span></button>
    <button class="sidebar-nav-btn active">📚 <span>Textbooks</span></button>
  </div>
</div>

<div class="dash">
<div class="bookstore-wrap">
  <div class="bookstore-filterbar">
    <div id="division-tabs" class="division-tabs-row"></div>
  </div>
  <div id="textbook-body"></div>
</div>
</div>
</div>

<div id="book-reader-overlay" class="hidden">
  <div class="reader-header">
    <div class="reader-title-block">
      <span id="reader-title"></span>
      <span id="reader-page-count"></span>
    </div>
    <div class="reader-header-actions">
      <button class="reader-fullscreen-btn" id="soundToggleBtn" onclick="toggleFlipSound()" title="Mute/unmute page-flip sound">🔊</button>
      <button class="reader-fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Toggle fullscreen">⛶</button>
      <button class="reader-close" onclick="closeBookReader()">✕</button>
    </div>
  </div>
  <div class="book-stage-wrap">
    <button class="reader-nav-btn" id="reader-prev" onclick="flipPage(-1)">◀</button>

    <div id="page-stage">
      <div id="page-status" class="page-loading hidden"></div>
      <div id="page-base" class="page-layer">
        <img id="page-base-img" class="page-image" alt="" />
      </div>
      <div id="page-leaf" class="page-layer">
        <img id="page-leaf-img" class="page-image" alt="" />
        <div class="leaf-shadow"></div>
      </div>
    </div>

    <button class="reader-nav-btn" id="reader-next" onclick="flipPage(1)">▶</button>
  </div>
</div>

<div id="page-complete-toggle" class="page-complete-toggle hidden" onclick="toggleCurrentPageComplete()">
  <span class="pct-check">✓</span>
  <span class="pct-label">Mark this page as completed</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script src="js/textbooks.js" defer></script>
</body>
</html>
