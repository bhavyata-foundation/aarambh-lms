<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bhavyata Portal — Principal</title>
<link rel="stylesheet" href="css/style-legacy.css" />
<link rel="stylesheet" href="css/style-new-design.css" />
</head>
<body>

<div id="preview-banner"></div>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand"><span class="topbar-brand-icon"><img src="assets/logo.png" alt="Bhavyata Foundation logo" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="brand-fallback-emoji">🌱</span></span><span class="brand">Bhavyata portal</span></span>
    <span class="page-label">PTM Schedule & Agenda</span>
  </div>
  <div class="user-menu" id="userMenu">
    <button class="user-menu-trigger" onclick="toggleUserMenu()">
      <span class="user-avatar">PR</span>
      <span class="user-name-block">
        <span class="user-name" id="principalName">Principal</span>
        <span class="tag">Principal</span>
      </span>
      <span class="user-caret">▾</span>
    </button>
    <div class="user-dropdown hidden" id="userDropdown">
      <button onclick="fetch('backend/logout.php').finally(() => location.href='index.html')">Log out</button>
    </div>
  </div>
</div>

<div class="layout">
  <div class="dash" style="max-width:100%;">
    <h1 id="principalSchoolName">My School</h1>
    <p class="sub">The one PTM calendar everyone sees — read-only here; the supervisor is the one who schedules it.</p>
    <div id="ptm-body"></div>
  </div>
</div>

<script src="js/ptm-view.js" defer></script>
<script src="js/principal.js" defer></script>
</body>
</html>
